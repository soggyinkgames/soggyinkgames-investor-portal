# netlify.toml — Soggy Ink Games Investor Portal
# This is the ASTRO PORTAL site's netlify.toml (NOT the Gatsby main site).
# 
# The Gatsby main site's netlify.toml needs a separate proxy rewrite — see README.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro Netlify adapter handles SSR functions automatically.
# No manual [[functions]] config needed.

# Security headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https://*.supabase.co; frame-ancestors 'none';"

# Cache control for sensitive pages — never cache
[[headers]]
  for = "/investors/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
    X-Robots-Tag = "noindex, nofollow"

# Static assets can be cached normally
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
